---
# ── Swap ──────────────────────────────────────────────────────────────────────
- name: Create swap file
  ansible.builtin.command: dd if=/dev/zero of=/swapfile bs=1M count={{ swap_size_mb }}
  args:
    creates: /swapfile

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Check if swap already active
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: _swap_active
  changed_when: false

- name: Format swap
  ansible.builtin.command: mkswap /swapfile
  when: "'/swapfile' not in _swap_active.stdout"
  register: _mkswap
  changed_when: "'Setting up swapspace' in _mkswap.stdout"

- name: Enable swap
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in _swap_active.stdout"

- name: Persist swap in /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

# ── Timezone ──────────────────────────────────────────────────────────────────
- name: Set timezone symlink
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ server_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Write /etc/timezone
  ansible.builtin.copy:
    content: "{{ server_timezone }}
"
    dest: /etc/timezone

# ── Packages ──────────────────────────────────────────────────────────────────
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - unzip
      - git
      - ufw
      - fail2ban
      - python3
      - python3-venv
      - python3-pip
      - ca-certificates
      - logrotate
      - openssl
    state: present

# ── Sysctl ────────────────────────────────────────────────────────────────────
- name: Write sysctl tuning file
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-vps.conf
    mode: "0644"
    content: |
      net.core.default_qdisc          = fq
      net.ipv4.tcp_congestion_control = bbr
      net.ipv4.ip_forward             = 1
      net.ipv4.tcp_fastopen           = 3
      vm.swappiness                   = 10
  notify: apply sysctl

# ── UFW ───────────────────────────────────────────────────────────────────────
- name: UFW default incoming deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW default outgoing allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: UFW allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: SSH

- name: UFW allow xray
  community.general.ufw:
    rule: allow
    port: "{{ xray_port | string }}"
    proto: tcp
    comment: xray VLESS+Reality

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ── fail2ban ──────────────────────────────────────────────────────────────────
- name: Configure fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    mode: "0644"
    content: |
      [sshd]
      enabled  = true
      port     = ssh
      maxretry = 5
      bantime  = 1h
      findtime = 10m
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

# ── SSH hardening ─────────────────────────────────────────────────────────────
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart sshd

- name: Restrict root login to key-only
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
  notify: restart sshd
