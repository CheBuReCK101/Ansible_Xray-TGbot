---
# ── Общее ────────────────────────────────────────────────────────────────────
# IP или домен VPS — используется в клиентских ссылках (make links)
###vps_host: "151.243.191.95"

# Timezone сервера. Список: timedatectl list-timezones
server_timezone: "Europe/Zurich"

# Swap-файл (важно для 1 GB RAM)
swap_size_mb: 512

# ── Xray ─────────────────────────────────────────────────────────────────────
# "latest" — всегда ставить последнюю версию с GitHub Releases
# Конкретная версия: например "24.9.30" (без "v")
xray_version: "latest"

# Порт, на котором слушает xray (443 — маскировка под HTTPS)
xray_port: 443

# Сайт-маскировка для Reality. Должен поддерживать TLSv1.3 + H2.
# ВАЖНО: писать без "www." и без "https://" — просто голый домен.
# Популярные домены (microsoft.com и т.п.) чаще профилируются DPI/РКН —
# рабочий и проверенный вариант: yahoo.com
xray_sni: "yahoo.com"

# TLS fingerprint клиента для Reality. "chrome" не заработал (handshake рвался
# сразу после TCP-коннекта), "firefox" — стабильно работает на всех платформах.
xray_fingerprint: "firefox"

# gRPC Stats API — только localhost, снаружи недоступен
xray_api_port: 10085

# ── Telegram-бот ─────────────────────────────────────────────────────────────
tgbot_user: tgbot
tgbot_dir: /opt/tgbot

# Как часто собирать дельта-трафик из xray и писать в SQLite (секунды)
tgbot_collect_interval: 60

# ── node_exporter (пока не используется, для Pi-мониторинга) ─────────────────
node_exporter_version: "1.8.2"
node_exporter_port: 9100
